[project]
name = "sa-s3-broker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "endermend", email = "endermend05@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.111",
    "dishka>=1.10.1",
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "boto3-stubs[s3]>=1.43.111", #FIXME move to dev group
    "sqlalchemy[asyncio]>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "arq>=0.25.0",
]

[project.scripts]
sa-s3-broker = "sa_s3_broker:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.4",
]

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true
